# Configuración del Detector YOLO con OpenCV DNN
# Puedes modificar estos valores según tus preferencias

[Modelo]
# Modelo a usar: yolov4-tiny (optimizado para Raspberry Pi)
modelo = yolov4-tiny

[Deteccion]
# Umbral de confianza para detecciones (0.0 a 1.0)
# Mayor valor = menos detecciones pero más precisas
confianza_minima = 0.5

# FPS objetivo para mostrar frames (1, 2, 5, 10, 30, etc)
# 1 = 1 FPS (1 segundo por frame)
# 30 = 30 FPS (máxima velocidad)
fps_objetivo = 1

# NMS IoU threshold (Non-Maximum Suppression)
nms_threshold = 0.4

[Voz]
# Intervalo mínimo entre anuncios (en segundos)
intervalo_anuncio = 4.0

# Velocidad de habla (palabras por minuto)
velocidad_habla = 150

# Anunciar solo nombre (sin "detecto")
anunciar_solo_nombre = true

[Camara]
# Índice de cámara (0, 1, 2, etc.)
# -1 para detección automática
indice_camara = -1

# Resolución de captura (ancho x alto)
# Valores comunes: 320x240, 640x480, 1280x720
ancho = 640
alto = 480

[Sistema]
# Tiempo de reintento para detectar cámara (segundos)
tiempo_reintento_camara = 10

# Máximo número de intentos para detectar cámara
max_intentos_camara = 30

# Modo debug (true/false)
debug = false

# Mostrar timestamp en cada mensaje (true/false)
mostrar_timestamp = true
